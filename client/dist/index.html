<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layboka AI Dashboard</title>
<style>
:root{--p:#ff6b00;--ink:#111;--gray:#5b5b62;--line:#ececf1;--green:#16a34a}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',Arial,sans-serif}
body{background:#f6f6f8;color:var(--ink);min-height:100vh}
.hidden{display:none!important}
#loginView{max-width:420px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.08)}
#loginView h1{font-size:24px;margin-bottom:6px}#loginView p{color:var(--gray);font-size:14px;margin-bottom:22px}
input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;font-size:15px;outline:none}
input:focus{border-color:var(--p)}
button.primary{width:100%;padding:14px;background:var(--p);color:#fff;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.box{max-width:1000px;margin:auto;padding:28px 18px}
.toolbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);padding:16px 20px;border-radius:16px;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.toolbar h1{font-size:20px}.toolbar .right{display:flex;gap:14px;align-items:center}
.logout{background:none;border:none;color:var(--p);font-weight:700;cursor:pointer;font-size:14px}
.banner{border-radius:16px;padding:18px 22px;margin-bottom:18px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.banner.ok{background:#e8f8ee;border:1px solid #bfe9d0}
.banner.lock{background:#fff1f0;border:1px solid #ffd7d2}
.banner h3{font-size:16px;margin-bottom:6px}
.banner .days{font-weight:800;color:var(--p)}
.recharge{background:var(--p);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;text-decoration:none;cursor:pointer;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.stat .lbl{font-size:13px;color:var(--gray)}.stat .val{font-size:28px;font-weight:800;margin-top:6px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h2{font-size:17px;margin-bottom:16px}
.info-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.info-line:last-child{border:none}.info-line b{color:var(--ink)}
</style>
</head><body>

<div id="loginView">
  <h1>Layboka AI</h1>
  <p>Login to your dashboard</p>
  <input id="loginStore" placeholder="Store URL or email">
  <input id="loginPass" type="password" placeholder="Password">
  <button class="primary" id="loginBtn">Login</button>
  <p id="loginErr" style="color:#d92d20;font-size:14px;min-height:18px;margin-top:10px"></p>
</div>

<div id="appView" class="hidden"><div class="box">
  <div class="toolbar">
    <h1>Dashboard</h1>
    <div class="right"><span id="storeLabel" style="font-size:14px;color:var(--gray)"></span>
      <button class="logout" id="logoutBtn">Logout</button></div>
  </div>
  <div id="banner"></div>
  <div class="grid" id="stats"></div>
  <div class="panel"><h2>Account</h2><div id="account"><div class="info-line"><span>Loading…</span><span></span></div></div></div>
</div></div>

<script>
const API='/api';
const makeApi=()=>{const t=localStorage.getItem('layboka_token');return{headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})}};};

document.getElementById('loginBtn').onclick=async()=>{
  const err=document.getElementById('loginErr');err.textContent='';
  const val=document.getElementById('loginStore').value.trim();
  const pass=document.getElementById('loginPass').value;
  const isEmail=/^\S+@\S+\.\S+$/.test(val);
  const body=isEmail?{email:val,password:pass}:{store:val,password:pass};
  try{
    const r=await fetch(API+'/store/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.success)throw new Error(d.message||'Login failed');
    localStorage.setItem('layboka_token',d.token);
    loadDashboard();
  }catch(e){err.textContent=e.message;}
};

const fmtDate=ms=>ms?new Date(ms).toLocaleDateString():'—';

async function loadDashboard(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  try{
    const r=await fetch(API+'/store/status',makeApi());
    const s=await r.json();
    if(!s.success)throw new Error(s.message);
    document.getElementById('storeLabel').textContent='Store logged in';
    const banner=document.getElementById('banner');
    if(s.locked||s.trialOver){
      banner.className='banner lock';
      banner.innerHTML='<div><h3>Your trial period is over</h3><p>Recharge now to reactivate your AI assistant instantly.</p></div>'+
        '<a class="recharge" href="/pricing">Recharge Now →</a>';
    }else{
      banner.className='banner ok';
      banner.innerHTML='<div><h3>Your AI assistant is active</h3>'+
        '<p>Free trial · <span class="days">'+s.daysLeft+'</span> day(s) remaining · ends '+fmtDate(s.trialEnds)+'</p></div>';
    }
    document.getElementById('stats').innerHTML=[
      ['Plan',s.plan],['Status',s.status],['Trial Days Left',s.daysLeft],['Chatbot',s.chatbotEnabled?'Active':'Locked']
    ].map(x=>'<div class="stat"><div class="lbl">'+x[0]+'</div><div class="val">'+x[1]+'</div></div>').join('');
    document.getElementById('account').innerHTML=[
      ['Store','Logged in'],['Plan',s.plan],['Status',s.status],['Trial ends',fmtDate(s.trialEnds)]
    ].map(x=>'<div class="info-line"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
  }catch(e){
    // no token / expired → login
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('appView').classList.add('hidden');
  }
}

document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('layboka_token');location.reload();};
if(localStorage.getItem('layboka_token'))loadDashboard();
</script>
</body></html>
